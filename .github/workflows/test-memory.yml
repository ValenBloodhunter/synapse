
name: Synapse Memory Tests

on:
  push:
    branches: [feature]
  workflow_dispatch:

jobs:
  test-memory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test initialization and preservation
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/synapse-test"

          python teachme/scripts/init_state.py machine-learning

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path.home() / "notes/machine-learning/.synapse/state.json"
          state = json.loads(p.read_text())

          assert state["schema_version"] == 1
          assert state["topic_slug"] == "machine-learning"

          state["concepts"]["chain-rule"] = {"mastery": 3}
          p.write_text(json.dumps(state), encoding="utf-8")
          PY

          python teachme/scripts/init_state.py machine-learning

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path.home() / "notes/machine-learning/.synapse/state.json"
          state = json.loads(p.read_text())

          assert state["concepts"]["chain-rule"]["mastery"] == 3
          print("PASS: Existing progress was preserved!")
          PY
      - name: Test mastery tracking
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/mastery-test"

          python teachme/scripts/init_state.py machine-learning

          python teachme/scripts/update_mastery.py \
            machine-learning chain-rule \
            --kind guided --result success \
            --task-id test-001 --note "Guided explanation"

          python teachme/scripts/update_mastery.py \
            machine-learning chain-rule \
            --kind independent --result success \
            --task-id test-002 --note "Independent solution"

          python teachme/scripts/update_mastery.py \
            machine-learning chain-rule \
            --kind independent --result success \
            --task-id test-003 --note "Second independent solution"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path.home() / "notes/machine-learning/.synapse/state.json"
          state = json.loads(path.read_text())
          record = state["concepts"]["chain-rule"]

          assert record["mastery"] == 3
          assert record["attempts"] == 3
          assert record["successful_attempts"] == 3

          print("PASS: Mastery correctly reached M3")
          PY

          if python teachme/scripts/update_mastery.py \
            machine-learning chain-rule \
            --kind independent --result success \
            --task-id test-003 --note "Duplicate"; then
            echo "FAIL: Duplicate assessment accepted"
            exit 1
          fi

          echo "PASS: Duplicate assessment rejected"
